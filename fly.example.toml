# Template only. Create your own app and explicitly select it when deploying.
# Add your chosen app name and region; no existing deployment is targeted here.
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  RELAYROOM_DB = "/data/relayroom.db"
  RELAYROOM_PUBLIC_URL = "https://relay.example.com"
  RELAYROOM_RETENTION_HOURS = "72"

[[mounts]]
  source = "relayroom_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
  cpu_kind = "shared"
